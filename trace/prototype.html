<title>Trace Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a framed art stage on the left, a quiet instrument panel on the right; stacks on phones. */
:root {
  --bg: #eef0f2;
  --panel: #ffffff;
  --fg: #171a20;
  --muted: #5d6573;
  --line: #d9dde3;
  --accent: #1f6f8b;
  --chip: #f2f4f7;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e12; --panel: #13161c; --fg: #e7eaf0; --muted: #8b93a3;
    --line: #262b35; --accent: #6fd3ea; --chip: #1b1f27; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e12; --panel: #13161c; --fg: #e7eaf0; --muted: #8b93a3;
  --line: #262b35; --accent: #6fd3ea; --chip: #1b1f27; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--display); }
.app {
  height: 100%; box-sizing: border-box;
  display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage { position: relative; min-width: 0; min-height: 0; border-radius: 6px; overflow: hidden; background: #070b14; }
.stage canvas { display: block; width: 100%; height: 100%; }
.caption {
  position: absolute; left: 14px; bottom: 12px; font: 500 11px/1.4 var(--mono);
  letter-spacing: .04em; color: rgba(255,255,255,.55); pointer-events: none;
}
.stage.light .caption { color: rgba(20,22,28,.55); }
.panel {
  min-width: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 18px;
}
h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.group { display: flex; flex-direction: column; gap: 8px; }
.label { font: 500 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--chip); border-radius: 6px; padding: 3px; gap: 3px; }
.seg button {
  font: 600 12.5px/1 var(--display); border: 0; border-radius: 4px; padding: 9px 0;
  background: transparent; color: var(--muted); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
  outline-offset: 2px;
}
.swatch[aria-pressed="true"] { border-color: var(--fg); }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; font-size: 13px; }
.slider output { font: 400 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
.toggles { display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggles input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.timeline { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.play {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--chip);
  color: var(--fg); cursor: pointer; font-size: 14px;
}
.timeline input { width: 100%; accent-color: var(--accent); margin: 0; }
.daylabel { font: 500 12px var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin: 0; }
.stats div { display: flex; flex-direction: column; gap: 3px; }
.stats dt { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stats dd { margin: 0; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats dd small { font-size: 12px; font-weight: 400; color: var(--muted); }
.actions { display: flex; gap: 8px; }
.btn {
  flex: 1; font: 600 13px var(--display); padding: 11px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--chip); color: var(--fg);
}
.note { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .stage { aspect-ratio: 3 / 2; max-width: 100%; }
  .panel { overflow: visible; }
}
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="c" aria-label="A Trace: organic lines drawn along the streets one person travels, thicker where they travel most"></canvas>
    <div class="caption" id="caption"></div>
  </div>

  <aside class="panel">
    <div>
      <h1>Trace</h1>
      <p class="sub">Six months of simulated trips from one home. Streets you travel more often get thicker and brighter.</p>
    </div>

    <div class="group">
      <span class="label">Form</span>
      <div class="seg" id="styles">
        <button data-v="veins">Veins</button>
        <button data-v="roots">Roots</button>
        <button data-v="mycelium">Mycelium</button>
        <button data-v="web">Web</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Palette</span>
      <div class="swatches" id="palettes"></div>
    </div>

    <div class="group">
      <div class="slider"><label for="organic">Organic</label><output id="organicOut"></output>
        <input type="range" id="organic" min="0" max="1" step="0.01"></div>
      <div class="slider"><label for="contrast">Habit emphasis</label><output id="contrastOut"></output>
        <input type="range" id="contrast" min="0.4" max="2.6" step="0.01"></div>
      <div class="slider"><label for="tendrils">Tendrils</label><output id="tendrilsOut"></output>
        <input type="range" id="tendrils" min="0" max="2" step="0.01"></div>
      <div class="slider"><label for="glow">Glow</label><output id="glowOut"></output>
        <input type="range" id="glow" min="0" max="1" step="0.01"></div>
    </div>

    <div class="group toggles">
      <label><input type="checkbox" id="streets"> Show street map</label>
      <label><input type="checkbox" id="labels"> Label places</label>
      <label><input type="checkbox" id="friend"> Overlay a friend's Trace</label>
    </div>

    <div class="group">
      <span class="label">Time</span>
      <div class="timeline">
        <button class="play" id="play" aria-label="Play six months of growth">▶</button>
        <input type="range" id="day" min="0" max="179" step="1" aria-label="Day">
      </div>
      <span class="daylabel" id="dayLabel"></span>
    </div>

    <dl class="stats">
      <div><dt>Trips</dt><dd id="sTrips">0</dd></div>
      <div><dt>Distance</dt><dd id="sDist">0</dd></div>
      <div><dt>Streets known</dt><dd id="sStreets">0</dd></div>
      <div><dt>Most-worn street</dt><dd id="sWorn">0</dd></div>
    </dl>

    <div class="actions">
      <button class="btn" id="newLife">New life</button>
    </div>
    <p class="note">Sample data. The city and the trips are generated, so no real location data is used.</p>
  </aside>
</div>

<script>
// ---------- constants ----------
const W = 1200, H = 800, COLS = 30, ROWS = 20, SP = 40;
const DAYS = 180, M_PER_UNIT = 12;
const START = new Date(2026, 3, 6); // a Monday

const PALETTES = {
  abyss:    { name: "Abyss",    bg: "#070b14", dim: "#1d4f73", hot: "#8af3ff", alt: "#ff7ab6", node: "#eafcff", street: "rgba(160,190,220,.07)", dark: true },
  ember:    { name: "Ember",    bg: "#110a08", dim: "#5e2310", hot: "#ffc56b", alt: "#7fd2ff", node: "#fff1d6", street: "rgba(255,200,160,.06)", dark: true },
  moss:     { name: "Moss",     bg: "#0a110b", dim: "#2b4a22", hot: "#d6ff8a", alt: "#ffad7a", node: "#f2ffe0", street: "rgba(190,230,170,.06)", dark: true },
  arterial: { name: "Arterial", bg: "#13060a", dim: "#5e1020", hot: "#ff5468", alt: "#ffd27a", node: "#ffe3e6", street: "rgba(255,170,180,.06)", dark: true },
  bone:     { name: "Bone",     bg: "#e9e8e3", dim: "#b9b7ae", hot: "#15171c", alt: "#2a56d0", node: "#15171c", street: "rgba(20,22,28,.07)", dark: false },
};

const DEFAULTS = { style: "veins", palette: "abyss", organic: 0.55, contrast: 1.1, tendrils: 1, glow: 0.6,
  streets: false, labels: true, friend: false, seed: 20260406 };
let S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem("trace-settings") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("trace-settings", JSON.stringify(S)); } catch (e) {} };

// ---------- random + noise ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { n |= 0; n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
function makeNoise(seed) {
  const r = mulberry32(seed), p = new Float32Array(512);
  for (let i = 0; i < 512; i++) p[i] = r() * 2 - 1;
  const g = (i, j) => p[(Math.imul(i, 73856093) ^ Math.imul(j, 19349663)) & 511];
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}

// ---------- city ----------
function buildCity(seed) {
  const rnd = mulberry32(seed), nx = makeNoise(seed + 11), ny = makeNoise(seed + 23);
  const nodes = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x0 = c * SP + SP / 2, y0 = r * SP + SP / 2;
    nodes.push({
      x: x0 + nx(x0 / 260, y0 / 260) * 85 + (rnd() - 0.5) * 18,
      y: y0 + ny(x0 / 260, y0 / 260) * 85 + (rnd() - 0.5) * 18,
    });
  }
  const edges = [], adj = nodes.map(() => []);
  const add = (a, b, speed) => {
    const len = Math.hypot(nodes[a].x - nodes[b].x, nodes[a].y - nodes[b].y);
    adj[a].push([b, edges.length]); adj[b].push([a, edges.length]);
    edges.push({ a, b, len, speed });
  };
  const id = (r, c) => r * COLS + c;
  const artRow = r => r % 6 === 2, artCol = c => c % 7 === 3;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (c < COLS - 1 && (artRow(r) || rnd() < 0.74)) add(id(r, c), id(r, c + 1), artRow(r) ? 0.5 : 1);
    if (r < ROWS - 1 && (artCol(c) || rnd() < 0.74)) add(id(r, c), id(r + 1, c), artCol(c) ? 0.5 : 1);
    if (r < ROWS - 1 && c < COLS - 1 && rnd() < 0.12) add(id(r, c), id(r + 1, c + 1), 0.9);
    if (r < ROWS - 1 && c > 0 && rnd() < 0.1) add(id(r, c), id(r + 1, c - 1), 0.9);
  }
  return { nodes, edges, adj };
}

function dijkstra(city, src, cost, target = -1) {
  const n = city.nodes.length, dist = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1);
  const heap = [[0, src]]; dist[src] = 0;
  const push = item => { heap.push(item); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  while (heap.length) {
    const [d, u] = pop();
    if (d > dist[u]) continue;
    if (u === target) break;
    for (const [v, ei] of city.adj[u]) {
      const nd = d + cost(ei);
      if (nd < dist[v]) { dist[v] = nd; prev[v] = ei; push([nd, v]); }
    }
  }
  return { dist, prev };
}
function pathEdges(city, res, src, dst) {
  const out = []; let u = dst;
  while (u !== src) { const ei = res.prev[u]; if (ei < 0) return null; out.push(ei); const e = city.edges[ei]; u = e.a === u ? e.b : e.a; }
  return out;
}

// ---------- a life ----------
function pickNode(city, rnd, reach, from, minD, maxD, avoid) {
  const f = city.nodes[from], cands = [];
  for (let i = 0; i < city.nodes.length; i++) {
    if (!isFinite(reach[i]) || avoid.has(i)) continue;
    const d = Math.hypot(city.nodes[i].x - f.x, city.nodes[i].y - f.y);
    if (d >= minD && d <= maxD) cands.push(i);
  }
  const pick = cands.length ? cands[Math.floor(rnd() * cands.length)] : from;
  avoid.add(pick); return pick;
}

function makePlaces(city, seed, home, fixed = {}) {
  const rnd = mulberry32(seed);
  const reach = dijkstra(city, home, ei => city.edges[ei].len).dist;
  const used = new Set([home, ...Object.values(fixed)]);
  const P = { home };
  P.work = fixed.work ?? pickNode(city, rnd, reach, home, 380, 560, used);
  P.gym = fixed.gym ?? pickNode(city, rnd, reach, P.work, 60, 220, used);
  P.grocery = fixed.grocery ?? pickNode(city, rnd, reach, home, 90, 200, used);
  P.cafe = fixed.cafe ?? pickNode(city, rnd, reach, home, 120, 260, used);
  P.park = fixed.park ?? pickNode(city, rnd, reach, home, 180, 340, used);
  P.parents = fixed.parents ?? pickNode(city, rnd, reach, home, 420, 620, used);
  P.friend = fixed.friend ?? pickNode(city, rnd, reach, home, 220, 380, used);
  // one-off destinations: restaurants, errands, a new trail
  const explore = Array.from({ length: 30 }, () => pickNode(city, rnd, reach, home, 80, 650, used));
  return { places: P, explore, homeDist: reach };
}

function simulate(city, P, explore, seed) {
  const r = mulberry32(seed), trips = [];
  const go = (day, from, to) => {
    if (from === to) return to;
    const jitter = 0.15 + r() * 0.25, salt = (r() * 1e9) | 0;
    const res = dijkstra(city, from, ei => { const e = city.edges[ei]; return e.len * e.speed * (1 + jitter * hash(ei * 31 + salt)); }, to);
    const edges = pathEdges(city, res, from, to);
    if (edges) trips.push({ day, edges, to });
    return to;
  };
  const weighted = table => { let t = 0; for (const k in table) t += table[k]; let x = r() * t; for (const k in table) { x -= table[k]; if (x <= 0) return k; } return Object.keys(table)[0]; };
  for (let d = 0; d < DAYS; d++) {
    const weekday = d % 7 < 5;
    if (weekday) {
      if (r() < 0.92) {
        let at = go(d, P.home, P.work);
        if (r() < 0.3) at = go(d, at, P.gym);
        if (r() < 0.2) at = go(d, at, P.grocery);
        go(d, at, P.home);
      }
      if (r() < 0.1) { const x = explore[Math.floor(r() * explore.length)]; go(d, P.home, x); go(d, x, P.home); }
      if (r() < 0.16) { const k = weighted({ cafe: 2, friend: 2, parents: 1 }); go(d, P.home, P[k]); go(d, P[k], P.home); }
    } else {
      const n = 1 + Math.floor(r() * 2.4);
      for (let i = 0; i < n; i++) {
        let at = go(d, P.home, P[weighted({ park: 3, parents: 1.4, friend: 2, grocery: 2, cafe: 2.5, gym: 1 })]);
        if (r() < 0.3) at = go(d, at, P[weighted({ cafe: 1, grocery: 1, park: 1 })]);
        go(d, at, P.home);
      }
      if (r() < 0.45) { const x = explore[Math.floor(r() * explore.length)]; go(d, P.home, x); go(d, x, P.home); }
    }
  }
  return trips;
}

const LABELS = { home: "Home", work: "Work", gym: "Gym", grocery: "Grocery", cafe: "Café", park: "Park", parents: "Parents", friend: "Friend" };

let city, people;
function generate() {
  city = buildCity(S.seed);
  const rnd = mulberry32(S.seed + 5);
  // home near the middle of the city
  let home = 0, best = Infinity;
  const hx = W * (0.38 + rnd() * 0.24), hy = H * (0.4 + rnd() * 0.2);
  city.nodes.forEach((n, i) => { const d = Math.hypot(n.x - hx, n.y - hy); if (d < best && city.adj[i].length >= 3) { best = d; home = i; } });
  const you = makePlaces(city, S.seed + 1, home);
  // the friend lives at your "friend" place, visits your home, and shares your café
  const them = makePlaces(city, S.seed + 2, you.places.friend, { friend: home, cafe: you.places.cafe });
  people = [
    { key: "you", ...you, trips: simulate(city, you.places, you.explore, S.seed + 3) },
    { key: "friend", ...them, trips: simulate(city, them.places, them.explore, S.seed + 4) },
  ];
  for (const p of people) p.maxHome = Math.max(...Array.from(p.homeDist).filter(isFinite));
}

function accumulate(p, upto) {
  const c = new Float32Array(city.edges.length), visits = {};
  let trips = 0, dist = 0;
  for (const t of p.trips) {
    if (t.day > upto) break;
    trips++; visits[t.to] = (visits[t.to] || 0) + 1;
    for (const ei of t.edges) { c[ei]++; dist += city.edges[ei].len; }
  }
  let max = 1, known = 0;
  for (let i = 0; i < c.length; i++) { if (c[i] > 0) known++; if (c[i] > max) max = c[i]; }
  return { c, max, trips, km: dist * M_PER_UNIT / 1000, known, visits };
}

// ---------- drawing ----------
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function geom(i) {
  const e = city.edges[i], A = city.nodes[e.a], B = city.nodes[e.b];
  const nx = -(B.y - A.y) / e.len, ny = (B.x - A.x) / e.len;
  const k = (hash(i * 7 + S.seed) - 0.5) * 2 * S.organic * e.len * 0.35;
  return { A, B, cx: (A.x + B.x) / 2 + nx * k, cy: (A.y + B.y) / 2 + ny * k, nx, ny, len: e.len };
}
const qpt = (g, t) => { const u = 1 - t; return [u * u * g.A.x + 2 * u * t * g.cx + t * t * g.B.x, u * u * g.A.y + 2 * u * t * g.cy + t * t * g.B.y]; };
function quad(c, g) { c.beginPath(); c.moveTo(g.A.x, g.A.y); c.quadraticCurveTo(g.cx, g.cy, g.B.x, g.B.y); c.stroke(); }

function branch(c, rng, x, y, ang, len, w, depth, droop) {
  const a2 = ang + (rng() - 0.5) * (0.5 + S.organic);
  const ex = x + Math.cos(a2) * len, ey = y + Math.sin(a2) * len + droop * len * 0.35;
  const cx = x + Math.cos(ang) * len * 0.55, cy = y + Math.sin(ang) * len * 0.55;
  c.lineWidth = w; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(cx, cy, ex, ey); c.stroke();
  if (depth <= 0) return;
  const na = Math.atan2(ey - cy, ex - cx), kids = rng() < 0.55 ? 2 : 1;
  for (let k = 0; k < kids; k++)
    branch(c, rng, ex, ey, na + (kids === 2 ? (k ? 0.55 : -0.55) : 0) + (rng() - 0.5) * 0.4, len * (0.58 + rng() * 0.2), w * 0.68, depth - 1, droop);
}

function drawTrace(c, p, acc, hotHex, pal) {
  const bg = hex2rgb(pal.bg), dim = hex2rgb(pal.dim), hot = hex2rgb(hotHex);
  const L = Math.log1p(acc.max), home = city.nodes[p.places.home];
  const list = [];
  for (let i = 0; i < acc.c.length; i++) if (acc.c[i] > 0) {
    const t = Math.log1p(acc.c[i]) / L;
    list.push({ i, t, te: Math.pow(t, S.contrast) });
  }
  list.sort((a, b) => a.te - b.te);
  const solid = te => rgba(mix(bg, mix(dim, hot, te), 0.3 + 0.7 * te));
  c.lineCap = "round"; c.lineJoin = "round";
  const sprouts = (it, g, w, opts) => {
    const n = Math.floor(S.tendrils * opts.count * (0.6 + (1 - it.te)));
    c.strokeStyle = rgba(mix(dim, hot, it.te * 0.7), opts.alpha);
    for (let s = 0; s < Math.min(n, 6); s++) {
      const rng = mulberry32(it.i * 9973 + s * 131 + S.seed);
      const [x, y] = qpt(g, 0.15 + rng() * 0.7), side = rng() < 0.5 ? -1 : 1;
      const base = opts.fromHome ? Math.atan2(y - home.y, x - home.x) : Math.atan2(g.ny * side, g.nx * side);
      branch(c, rng, x, y, base + (rng() - 0.5) * 1.3, opts.len * (0.6 + rng() * 0.8), Math.min(w * 0.45, opts.maxW), opts.depth, opts.droop);
    }
  };

  if (S.style === "veins") {
    for (const it of list) {
      const g = geom(it.i), w = 0.7 + it.te * 9;
      sprouts(it, g, w, { count: 2.2, alpha: 0.55, len: 16, depth: 3, droop: 0, maxW: 1.6 });
      c.strokeStyle = solid(it.te); c.lineWidth = w; quad(c, g);
    }
  } else if (S.style === "roots") {
    for (const it of list) {
      const e = city.edges[it.i], g = geom(it.i);
      const near = 1 - Math.min(1, Math.min(p.homeDist[e.a], p.homeDist[e.b]) / (p.maxHome * 0.75));
      const w = (0.6 + it.te * 8) * (0.4 + 1.2 * near);
      sprouts(it, g, w, { count: 3.2, alpha: 0.5, len: 22, depth: 4, droop: 0.6, maxW: 2.2, fromHome: true });
      c.strokeStyle = solid(it.te); c.lineWidth = w; quad(c, g);
    }
  } else if (S.style === "mycelium") {
    for (const it of list) {
      const g = geom(it.i), hairs = 2 + Math.round(it.te * 11), spread = 2 + it.te * 12;
      c.strokeStyle = rgba(mix(dim, hot, 0.25 + 0.75 * it.te), 0.16 + 0.5 * it.te);
      for (let h = 0; h < hairs; h++) {
        const r = mulberry32(it.i * 7919 + h * 104729 + S.seed);
        const oa = (r() - 0.5) * spread, ob = (r() - 0.5) * spread, oc = (r() - 0.5) * g.len * (0.2 + 0.5 * S.organic);
        c.lineWidth = 0.4 + r() * 0.55;
        c.beginPath();
        c.moveTo(g.A.x + g.nx * oa, g.A.y + g.ny * oa);
        c.quadraticCurveTo(g.cx + g.nx * oc, g.cy + g.ny * oc, g.B.x + g.nx * ob, g.B.y + g.ny * ob);
        c.stroke();
      }
      sprouts(it, g, 1.2, { count: 3.5, alpha: 0.35, len: 10, depth: 2, droop: 0, maxW: 0.6 });
    }
  } else if (S.style === "web") {
    for (const it of list) {
      const g0 = geom(it.i), sag = g0.len * 0.1 * (0.4 + S.organic);
      const g = { ...g0, cx: (g0.A.x + g0.B.x) / 2, cy: (g0.A.y + g0.B.y) / 2 + sag };
      c.strokeStyle = solid(it.te); c.lineWidth = 0.5 + it.te * 2.2; quad(c, g);
    }
    // capture spiral: rings around home linking visited junctions
    const nodeT = new Map();
    for (const it of list) { const e = city.edges[it.i]; for (const n of [e.a, e.b]) nodeT.set(n, Math.max(nodeT.get(n) || 0, it.te)); }
    const step = 30, rings = new Map();
    for (const [n, t] of nodeT) {
      if (n === p.places.home) continue;
      const q = city.nodes[n], rr = Math.hypot(q.x - home.x, q.y - home.y), k = Math.round(rr / step);
      if (!rings.has(k)) rings.set(k, []);
      rings.get(k).push({ th: Math.atan2(q.y - home.y, q.x - home.x), r: rr, t, q });
    }
    c.lineWidth = 0.6;
    for (const ring of rings.values()) {
      ring.sort((a, b) => a.th - b.th);
      for (let j = 0; j < ring.length; j++) {
        const a = ring[j], b = ring[(j + 1) % ring.length];
        let dth = b.th - a.th; if (dth <= 0) dth += Math.PI * 2;
        if (ring.length < 2 || dth > 0.9) continue;
        const mth = a.th + dth / 2, mr = (a.r + b.r) / 2 * (0.93 - 0.04 * S.organic);
        c.strokeStyle = rgba(mix(dim, hot, (a.t + b.t) / 2), 0.25 + 0.45 * (a.t + b.t) / 2);
        c.beginPath(); c.moveTo(a.q.x, a.q.y);
        c.quadraticCurveTo(home.x + Math.cos(mth) * mr, home.y + Math.sin(mth) * mr, b.q.x, b.q.y); c.stroke();
      }
    }
    // dew on the heaviest threads
    c.fillStyle = rgba(hex2rgb(pal.node), 0.85);
    for (const it of list) {
      const drops = Math.floor(S.tendrils * it.te * 3);
      const g0 = geom(it.i), sag = g0.len * 0.1 * (0.4 + S.organic);
      const g = { ...g0, cx: (g0.A.x + g0.B.x) / 2, cy: (g0.A.y + g0.B.y) / 2 + sag };
      for (let d = 0; d < drops; d++) {
        const r = mulberry32(it.i * 313 + d * 17 + S.seed), [x, y] = qpt(g, 0.15 + r() * 0.7);
        c.beginPath(); c.arc(x, y, 0.8 + r() * 1.6, 0, Math.PI * 2); c.fill();
      }
    }
  }
}

function drawPlaces(c, p, acc, hotHex, pal, s, isYou) {
  const hot = hex2rgb(hotHex), nodeC = hex2rgb(pal.node);
  const h = city.nodes[p.places.home];
  const grad = c.createRadialGradient(h.x, h.y, 0, h.x, h.y, 34);
  grad.addColorStop(0, rgba(hot, pal.dark ? 0.55 : 0.25)); grad.addColorStop(1, rgba(hot, 0));
  c.fillStyle = grad; c.beginPath(); c.arc(h.x, h.y, 34, 0, Math.PI * 2); c.fill();
  c.lineWidth = 1;
  for (const [r, a] of [[10, 0.7], [16, 0.3]]) { c.strokeStyle = rgba(hot, a); c.beginPath(); c.arc(h.x, h.y, r, 0, Math.PI * 2); c.stroke(); }
  c.fillStyle = rgba(nodeC); c.beginPath(); c.arc(h.x, h.y, 5, 0, Math.PI * 2); c.fill();

  const maxV = Math.max(1, ...Object.values(acc.visits));
  c.font = `500 ${11 / s}px "JetBrains Mono", ui-monospace, monospace`;
  for (const [k, n] of Object.entries(p.places)) {
    if (k === "home") continue;
    const v = acc.visits[n] || 0; if (!v) continue;
    // shared places are drawn once, by you
    if (!isYou && (k === "friend" || k === "cafe")) continue;
    if (isYou && k === "friend" && S.friend) continue;
    const q = city.nodes[n], r = 2.5 + 4.5 * Math.sqrt(v / maxV);
    c.fillStyle = pal.bg; c.strokeStyle = rgba(hot, 0.95); c.lineWidth = 1.5;
    c.beginPath(); c.arc(q.x, q.y, r, 0, Math.PI * 2); c.fill(); c.stroke();
    if (S.labels) { c.fillStyle = rgba(nodeC, 0.8); c.fillText(LABELS[k], q.x + r + 5 / s, q.y + 4 / s); }
  }
  if (S.labels) { c.fillStyle = rgba(nodeC, 0.95); c.fillText(isYou ? "Home" : "Friend's home", h.x + 20, h.y + 4 / s); }
}

// ---------- canvas plumbing ----------
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const layer = document.createElement("canvas"), lctx = layer.getContext("2d");
const stage = document.getElementById("stage");
let dpr = 1;
const filterOK = (() => { try { ctx.filter = "blur(2px)"; const ok = ctx.filter === "blur(2px)"; ctx.filter = "none"; return ok; } catch (e) { return false; } })();

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(stage.clientWidth * dpr)), h = Math.max(1, Math.round(stage.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = layer.width = w; canvas.height = layer.height = h; }
  render();
}

let day = DAYS - 1;
function render() {
  if (!city || !canvas.width) return;
  const pal = PALETTES[S.palette], cw = canvas.width, ch = canvas.height;
  stage.style.background = pal.bg; stage.classList.toggle("light", !pal.dark);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, cw, ch);
  const s = Math.min(cw / W, ch / H) * 0.96, ox = (cw - W * s) / 2, oy = (ch - H * s) / 2;

  if (S.streets) {
    ctx.setTransform(s, 0, 0, s, ox, oy); ctx.strokeStyle = pal.street; ctx.lineWidth = dpr / s;
    ctx.beginPath();
    for (const e of city.edges) { const A = city.nodes[e.a], B = city.nodes[e.b]; ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); }
    ctx.stroke();
  }

  const shown = S.friend ? [people[1], people[0]] : [people[0]];
  const accs = shown.map(p => accumulate(p, day));
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, cw, ch);
  lctx.setTransform(s, 0, 0, s, ox, oy);
  shown.forEach((p, k) => drawTrace(lctx, p, accs[k], p.key === "you" ? pal.hot : pal.alt, pal));

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (S.glow > 0 && filterOK) {
    ctx.globalCompositeOperation = pal.dark ? "lighter" : "source-over";
    ctx.filter = `blur(${Math.max(2, 9 * s)}px)`; ctx.globalAlpha = S.glow * (pal.dark ? 0.85 : 0.3);
    ctx.drawImage(layer, 0, 0);
    ctx.filter = "none"; ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  ctx.drawImage(layer, 0, 0);

  ctx.setTransform(s, 0, 0, s, ox, oy);
  shown.forEach((p, k) => drawPlaces(ctx, p, accs[k], p.key === "you" ? pal.hot : pal.alt, pal, s / dpr, p.key === "you"));

  const mine = accs[accs.length - 1];
  document.getElementById("sTrips").textContent = mine.trips;
  document.getElementById("sDist").innerHTML = `${Math.round(mine.km).toLocaleString()} <small>km</small>`;
  document.getElementById("sStreets").textContent = mine.known;
  document.getElementById("sWorn").innerHTML = `${mine.max} <small>passes</small>`;
  const date = new Date(START); date.setDate(date.getDate() + day);
  const ds = date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  document.getElementById("dayLabel").textContent = `Day ${day + 1} of ${DAYS} · ${ds}`;
  document.getElementById("caption").textContent = `${PALETTES[S.palette].name.toUpperCase()} · ${S.style.toUpperCase()} · ${ds.toUpperCase()}`;
}

// ---------- controls ----------
const $ = id => document.getElementById(id);
function syncUI() {
  document.querySelectorAll("#styles button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S.style));
  document.querySelectorAll("#palettes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S.palette));
  for (const k of ["organic", "contrast", "tendrils", "glow"]) { $(k).value = S[k]; $(k + "Out").textContent = (+S[k]).toFixed(2); }
  for (const k of ["streets", "labels", "friend"]) $(k).checked = S[k];
  $("day").value = day;
}
const palWrap = $("palettes");
for (const [k, p] of Object.entries(PALETTES)) {
  const b = document.createElement("button");
  b.className = "swatch"; b.dataset.v = k; b.setAttribute("aria-label", p.name + " palette"); b.title = p.name;
  b.style.background = `radial-gradient(circle at 50% 50%, ${p.hot} 0 22%, ${p.dim} 23% 46%, ${p.bg} 47%)`;
  palWrap.appendChild(b);
}
$("styles").addEventListener("click", e => { const v = e.target.dataset?.v; if (v) { S.style = v; save(); syncUI(); render(); } });
palWrap.addEventListener("click", e => { const v = e.target.closest(".swatch")?.dataset.v; if (v) { S.palette = v; save(); syncUI(); render(); } });
for (const k of ["organic", "contrast", "tendrils", "glow"]) $(k).addEventListener("input", e => { S[k] = +e.target.value; $(k + "Out").textContent = S[k].toFixed(2); save(); render(); });
for (const k of ["streets", "labels", "friend"]) $(k).addEventListener("change", e => { S[k] = e.target.checked; save(); render(); });
$("day").addEventListener("input", e => { stop(); day = +e.target.value; render(); });
$("newLife").addEventListener("click", () => { S.seed = (Math.random() * 1e9) | 0; save(); generate(); render(); });

let playing = false, last = 0;
function stop() { playing = false; $("play").textContent = "▶"; $("play").setAttribute("aria-label", "Play six months of growth"); }
function tick(ts) {
  if (!playing) return;
  if (ts - last > 45) {
    last = ts; day++; $("day").value = day; render();
    if (day >= DAYS - 1) { stop(); return; }
  }
  requestAnimationFrame(tick);
}
$("play").addEventListener("click", () => {
  if (playing) return stop();
  if (day >= DAYS - 1) day = 0;
  playing = true; $("play").textContent = "❚❚"; $("play").setAttribute("aria-label", "Pause");
  requestAnimationFrame(tick);
});

generate(); syncUI();
new ResizeObserver(resize).observe(stage);
resize();
</script>
